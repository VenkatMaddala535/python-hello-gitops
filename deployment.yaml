apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-hello
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: python-hello
  template:
    metadata:
      labels:
        app: python-hello
    spec:
      containers:
        - name: python-hello
          image: venkatmaddala/python-hello:11
          ports:
            - containerPort: 5001
          imagePullPolicy: Always
